<svg viewBox="0 0 1200 440" width="1200" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="memcellar v2. A memory for your coding agents that you can read, correct and undo.">
<style>@font-face{font-family:T;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:S;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:I;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:K;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2')}
.ln{opacity:0;animation:ln 16s ease-out infinite}
@keyframes ln{0%{opacity:0;transform:translateY(6px)}4%{opacity:1;transform:none}86%{opacity:1}94%,100%{opacity:0}}
.car{animation:car 1s steps(1) infinite}
@keyframes car{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.car{animation:none}.ln{animation:none;opacity:1}}
.k{font:12.5px K;letter-spacing:.28em;fill:#3a556e}
.t{font:104.0px T;fill:#13263a;letter-spacing:-.005em}
.s{font:22px S;fill:#24394e}
.m{font:13px M;fill:#172b3e}
.d{fill:#5a7086}
</style>
<defs>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .045 0"/></filter>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f3ed"/><stop offset="1" stop-color="#ece6db"/></linearGradient>
<radialGradient id="light" cx=".18" cy=".1" r=".75"><stop offset="0" stop-color="#ffffff" stop-opacity=".7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3a2f22" flood-opacity=".08"/><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3a2f22" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="440" fill="url(#paper)"/>
<rect width="1200" height="440" fill="url(#light)"/>
<rect x="664" y="64" width="476" height="300" rx="18" fill="#fffdf9" filter="url(#lift)"/>
<rect x="664.5" y="64.5" width="475" height="299" rx="18" fill="none" stroke="#e4ddd0"/>
<line x1="664" y1="117" x2="1140" y2="117" stroke="#eee8dd"/>
<circle cx="692" cy="90.4" r="4.9" fill="#e3a597"/><circle cx="710.2" cy="90.4" r="4.9" fill="#e6cb92"/><circle cx="728.4" cy="90.4" r="4.9" fill="#a6c6a0"/>
<text class="m d" x="749.2" y="95" style="font-size:12.0px">~/vault — claude</text>
<text class="ln m" x="690" y="143" style="animation-delay:0s" xml:space="preserve"><tspan fill="#3d7a5a">●</tspan> New session <tspan class="d">· it already knows you</tspan></text><text class="ln m" x="690" y="167" style="animation-delay:0.8s" xml:space="preserve"><tspan class="d">  your name · your stack · how you work</tspan></text><text class="ln m" x="690" y="207" style="animation-delay:2.2s" xml:space="preserve"><tspan class="d">you  ›</tspan> I prefer TypeScript for new projects.</text><text class="ln m" x="690" y="243" style="animation-delay:4s" xml:space="preserve"><tspan class="d">agent›</tspan> Saved to notes/preferences.md,</text><text class="ln m" x="690" y="263" style="animation-delay:4.4s" xml:space="preserve"><tspan class="d">       a plain file you can read and edit</tspan></text><text class="ln m" x="690" y="303" style="animation-delay:6s" xml:space="preserve"><tspan fill="#a8553a">git  ›</tspan> 3fd81a0 note: prefers TypeScript</text><text class="ln m" x="690" y="327" style="animation-delay:6.4s" xml:space="preserve"><tspan class="d">       1 commit · undo it with git revert</tspan></text>
<rect class="car" x="690" y="338" width="8" height="15" fill="#172b3e" opacity=".7"/>
<rect width="1200" height="440" filter="url(#grain)"/>
<text class="k" x="70" y="110">CLAUDE CODE · CODEX · OBSIDIAN · GIT</text>
<text class="t" x="64" y="214">memcellar</text>
<line x1="72" y1="250" x2="132" y2="250" stroke="#3a556e" stroke-opacity=".6"/><text x="144" y="255" style="font:14px I;letter-spacing:.12em;fill:#3a556e">v2</text><line x1="175" y1="250" x2="235" y2="250" stroke="#3a556e" stroke-opacity=".6"/>
<text class="s" x="70" y="300">A memory for your coding agents</text>
<text class="s" x="70" y="328">that you can read, correct and undo.</text>
</svg>