<rect x="40.5" y="368.5" width="639" height="431" rx="18" fill="none" stroke="#e4ddd0"/>
<line x1="40" y1="443" x2="680" y2="443" stroke="#eee8dd"/>
<circle cx="68" cy="405.4" r="7.4" fill="#e3a597"/><circle cx="95.3" cy="405.4" r="7.4" fill="#e6cb92"/><circle cx="122.6" cy="405.4" r="7.4" fill="#a6c6a0"/>
<text class="m d" x="153.8" y="412" style="font-size:17.9px">~/vault — claude</text>
<text class="ln m" x="79.0" y="480" style="animation-delay:0s" xml:space="preserve"><tspan fill="#3d7a5a">●</tspan> New session <tspan class="d">· it already knows you</tspan></text><text class="ln m" x="79.0" y="514" style="animation-delay:0.8s" xml:space="preserve"><tspan class="d">  your name · your stack · how you work</tspan></text><text class="ln m" x="79.0" y="570" style="animation-delay:2.2s" xml:space="preserve"><tspan class="d">you  ›</tspan> I prefer TypeScript for new projects.</text><text class="ln m" x="79.0" y="621" style="animation-delay:4s" xml:space="preserve"><tspan class="d">agent›</tspan> Saved to notes/preferences.md,</text><text class="ln m" x="79.0" y="650" style="animation-delay:4.4s" xml:space="preserve"><tspan class="d">       a plain file you can read and edit</tspan></text><text class="ln m" x="79.0" y="706" style="animation-delay:6s" xml:space="preserve"><tspan fill="#a8553a">git  ›</tspan> 3fd81a0 note: prefers TypeScript</text><text class="ln m" x="79.0" y="740" style="animation-delay:6.4s" xml:space="preserve"><tspan class="d">       1 commit · undo it with git revert</tspan></text>
<rect class="car" x="79.0" y="756" width="12" height="22" fill="#172b3e" opacity=".7"/>
<rect width="720" height="850" filter="url(#grain)"/>
<text class="k" x="48" y="78">CLAUDE CODE · CODEX · OBSIDIAN · GIT</text>
<text class="t" x="44" y="186">memcellar</text>
<line x1="50" y1="226" x2="110" y2="226" stroke="#3a556e" stroke-opacity=".6"/><text x="122" y="231" style="font:19px I;letter-spacing:.12em;fill:#3a556e">v2</text><line x1="162" y1="226" x2="222" y2="226" stroke="#3a556e" stroke-opacity=".6"/>
<text class="s" x="48" y="282">A memory for your coding agents</text>
<text class="s" x="48" y="320">that you can read, correct and undo.</text>
