<style>@font-face{font-family:S;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M;src:url(data:font/woff2;base64,) format('woff2')}@keyframes q{0%,1.00%{opacity:0;transform:translateY(8px);}9.00%{opacity:1;transform:none}89.00%{opacity:1}96.00%,100%{opacity:0}}.q{opacity:0;animation:q 5.0s cubic-bezier(.2,.7,.2,1) infinite}@keyframes p1{0%,10.00%{stroke-dashoffset:1;opacity:1}20.00%{stroke-dashoffset:0}89.00%{stroke-dashoffset:0;opacity:1}96.00%,100%{stroke-dashoffset:0;opacity:0}}.p1{stroke-dasharray:1;stroke-dashoffset:1;animation:p1 5.0s ease-in-out infinite}@keyframes l1{0%,11.00%{opacity:0;}19.00%{opacity:1;transform:none}89.00%{opacity:1}96.00%,100%{opacity:0}}.l1{opacity:0;animation:l1 5.0s cubic-bezier(.2,.7,.2,1) infinite}@keyframes h1{0%,19.00%{transform:scaleX(0)}26.00%{transform:scaleX(1)}89.00%{transform:scaleX(1);opacity:1}96.00%,100%{transform:scaleX(1);opacity:0}}.h1{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:h1 5.0s cubic-bezier(.2,.7,.2,1) infinite}@keyframes p2{0%,26.00%{stroke-dashoffset:1;opacity:1}35.00%{stroke-dashoffset:0}89.00%{stroke-dashoffset:0;opacity:1}96.00%,100%{stroke-dashoffset:0;opacity:0}}.p2{stroke-dasharray:1;stroke-dashoffset:1;animation:p2 5.0s ease-in-out infinite}@keyframes l2{0%,27.00%{opacity:0;}35.00%{opacity:1;transform:none}89.00%{opacity:1}96.00%,100%{opacity:0}}.l2{opacity:0;animation:l2 5.0s cubic-bezier(.2,.7,.2,1) infinite}@keyframes h2{0%,35.00%{transform:scaleX(0)}40.00%{transform:scaleX(1)}89.00%{transform:scaleX(1);opacity:1}96.00%,100%{transform:scaleX(1);opacity:0}}.h2{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:h2 5.0s cubic-bezier(.2,.7,.2,1) infinite}@keyframes h3{0%,37.60%{transform:scaleX(0)}42.60%{transform:scaleX(1)}89.00%{transform:scaleX(1);opacity:1}96.00%,100%{transform:scaleX(1);opacity:0}}.h3{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:h3 5.0s cubic-bezier(.2,.7,.2,1) infinite}@ke