interface:
  display_name: "ADR"
  short_description: "Records an expensive-to-reverse decision and closes the ones it contradicts"
  default_prompt: "Use $adr to record this decision: in a project as docs/decisions/NNNN-*.md, in a vault as a type: decision note, superseding any earlier decision it contradicts."
policy:
  allow_implicit_invocation: false
